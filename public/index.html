<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RSS Viewer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside id="feed-sidebar" class="sidebar is-open" aria-label="Feed categories">
        <div class="sidebar-header">
          <h2>Categories</h2>
          <button id="saved-view-toggle" class="saved-view-toggle" type="button">Saved</button>
        </div>
        <nav id="sidebar-groups" class="sidebar-groups" aria-label="Imported feed list"></nav>
      </aside>

      <main class="viewer" aria-live="polite">
        <button
          id="sidebar-toggle"
          class="sidebar-toggle"
          type="button"
          aria-controls="feed-sidebar"
          aria-expanded="false"
        >
          Browse feeds
        </button>

        <h1>RSS Viewer</h1>

        <section id="feed-view">
          <form id="feed-form" class="feed-form" novalidate>
            <label for="feed-url">Feed URL</label>
            <div class="controls">
              <input
                id="feed-url"
                name="url"
                type="url"
                placeholder="https://example.com/feed.xml"
                required
                autocomplete="url"
              />
              <button id="load-feed" type="submit">Load</button>
            </div>
          </form>

          <section class="opml-import" aria-label="OPML import">
            <label for="opml-file">Import OPML</label>
            <input id="opml-file" type="file" accept=".opml,.xml,text/xml,application/xml" />
            <button id="opml-export" type="button">Export OPML</button>
          </section>

          <section id="status" class="status" role="status">Enter a feed URL to load recent items.</section>

          <section class="recent-feeds" aria-label="Recent feeds">
            <h2>Recent feeds</h2>
            <ul id="recent-feeds" class="recent-feeds-list"></ul>
            <p id="recent-feeds-empty" class="recent-feeds-empty">No recent feeds yet.</p>
          </section>

          <section class="item-search" aria-label="Search cached items">
            <label for="item-search">Search items</label>
            <input
              id="item-search"
              name="item-search"
              type="search"
              placeholder="Search by title or summary"
              autocomplete="off"
            />
          </section>

          <ul id="results" class="results" aria-label="Feed items"></ul>
        </section>

        <section id="saved-view" class="saved-view is-hidden" aria-label="Saved items">
          <div class="saved-header">
            <h2>Saved items</h2>
            <button id="feed-view-toggle" class="saved-view-toggle" type="button">Back to feeds</button>
          </div>
          <p id="saved-empty" class="saved-empty">No saved items yet.</p>
          <ul id="saved-results" class="results"></ul>
        </section>
      </main>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
